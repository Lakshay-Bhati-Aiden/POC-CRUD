<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wide">
    <div class="page-header">
      <h1>Dashboard</h1>
      <a href="page1.html" class="btn">+ New application</a>
    </div>
    <p id="message" class="muted">Loading...</p>
    <table border="1">
        <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Plan</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <div class="pagination">
      <button id="prev-btn" class="btn-secondary">Previous</button>
      <span id="page-info" class="muted"></span>
      <button id="next-btn" class="btn-secondary">Next</button>
    </div>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
